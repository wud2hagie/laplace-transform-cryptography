name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile Java sources when present
        run: |
          mapfile -t files < <(find . -type f -name '*.java' -not -path '*/.git/*')
          if [ "${#files[@]}" -gt 0 ]; then
            mkdir -p /tmp/java-classes
            javac -d /tmp/java-classes "${files[@]}"
          else
            echo "No Java sources found."
          fi
      - name: Check MATLAB source hygiene
        run: |
          git diff --check
          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' --include='*.m' .; then
            echo "Merge conflict markers found"
            exit 1
          fi
          echo "MATLAB syntax/runtime checks require MATLAB or GNU Octave and are not performed by this workflow."
